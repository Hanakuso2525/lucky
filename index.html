<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖怪ウォッチバスターズ 鬼玉エディタ</title>
<style>
:root{--bg:#f4f2fb;--card:#fff;--ink:#1d1a2b;--sub:#6b6880;--line:#e0dcf0;--ac:#5b3fd6;--ac2:#8a5cf5;--acink:#fff;--soft:#eee9ff;--ok:#0f7a4a;--ng:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12111a;--card:#1c1b28;--ink:#eeecf7;--sub:#9c9ab0;--line:#332f45;--ac:#9a86ff;--ac2:#b79cff;--acink:#12101c;--soft:#2a2645;--ok:#5fd59b;--ng:#ff8a80}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6rem)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acink);padding:1.4rem 1rem 1.6rem}
.hero>div{max-width:36rem;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 .3rem;letter-spacing:.02em}
.hero p{margin:0;font-size:.82rem;opacity:.92}
main{max-width:36rem;margin:-.9rem auto 0;padding:0 .9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.9rem;box-shadow:0 2px 10px rgba(60,40,140,.07)}
h2{font-size:1rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem}
.step{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ac);color:var(--acink);font-size:.8rem}
label{display:block;font-size:.82rem;color:var(--sub);margin:.7rem 0 .25rem}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.55rem .6rem}
input[type=radio]{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
button{font:inherit;font-weight:600;background:var(--ac);color:var(--acink);border:0;border-radius:8px;padding:.6rem 1rem;margin-top:.8rem;cursor:pointer}
button.sub{background:var(--soft);color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;background:var(--soft);padding:.25rem;border-radius:12px;margin-bottom:.9rem}
.tabs button{margin:0;background:transparent;color:var(--sub);padding:.5rem .2rem;font-size:.9rem}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ac);box-shadow:0 1px 4px rgba(60,40,140,.15)}
.cand{display:flex;gap:.6rem;align-items:center;padding:.5rem .2rem;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--ink);margin:0;font-size:.9rem}
.cand:first-child{border-top:0}
.stat{background:var(--soft);border-radius:10px;padding:.6rem .8rem;font-size:.9rem;font-variant-numeric:tabular-nums}
#msg{font-size:.9rem;min-height:1.4em;margin:.2rem .3rem 1rem;white-space:pre-wrap}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.hide{display:none!important}
small{color:var(--sub);display:block;margin-top:.4rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(60,40,140,.15);padding:.6rem .9rem calc(env(safe-area-inset-bottom,0px) + .6rem)}
.bar>div{max-width:36rem;margin:0 auto}
.bar summary{cursor:pointer;font-weight:600;color:var(--ac)}
.bar ul{list-style:none;margin:.4rem 0 0;padding:0;max-height:30vh;overflow:auto;font-size:.88rem}
.bar li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.25rem 0;border-top:1px solid var(--line)}
.bar li button{margin:0;padding:.1rem .5rem;background:var(--soft);color:var(--ng)}
.bar #save{width:100%;margin-top:.5rem}
</style>
</head>
<body>
<header class="hero"><div>
<h1>妖怪ウォッチバスターズ セーブエディタ</h1>
<p>赤猫団・白犬隊・月兎組対応セーブエディタ (Ver.2.0.0)</p>
</div></header>
<main>
<section class="card">
<h2><span class="step">1</span>ファイルを選ぶ</h2>
<label for="head">head.yw（韓国版・欧米版は head.yw_g）</label>
<input type="file" id="head">
<label for="save0">game*.yw（韓国版・欧米版は game*.yw_g）</label>
<input type="file" id="save0">
<button id="load">復号する</button>
</section>

<div id="editor" class="hide">
<h2 style="margin:.2rem .2rem .6rem"><span class="step">2</span>変更をリストに追加</h2>
<div class="tabs" role="tablist">
<button role="tab" data-t="oni" aria-selected="true">鬼玉</button>
<button role="tab" data-t="item" aria-selected="false">アイテム</button>
<button role="tab" data-t="gacha" aria-selected="false">ガシャ回数</button>
</div>

<section class="card" data-p="oni">
<label for="cur">現在の鬼玉の数（ゲーム内の表示どおり）</label>
<input type="number" id="cur" min="0" max="4294967295" inputmode="numeric">
<button class="sub" id="find">検索</button>
<div id="cands" style="margin-top:.6rem"></div>
<div id="newbox" class="hide">
<label for="nv">新しい鬼玉の数</label>
<input type="number" id="nv" min="0" max="4294967295" inputmode="numeric">
<small>上限はゲーム側で不明です。極端に大きい値はおすすめしません。</small>
<button id="oadd">リストに追加</button>
</div>
</section>

<section class="card hide" data-p="item">
<div class="row">
<div><label for="ord">IDの表記</label>
<select id="ord"><option value="simple">シンプル</option><option value="adv">バイト順</option></select></div>
<div><label for="iid">アイテムID（8桁16進）</label>
<input type="text" id="iid" placeholder="9A89BF7C" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
</div>
<small>シンプル: 9A89BF7C ／ バイト順（アドバンス）: 7C BF 89 9A</small>
<button class="sub" id="ifind">IDで検索</button>
<div id="icands" style="margin-top:.6rem"></div>
<div id="inewbox" class="hide">
<label for="inv">新しい所持数（1〜99）</label>
<input type="number" id="inv" min="1" max="99" inputmode="numeric">
<small>99を超えるとセーブ時にアイテムが消える報告があるため、上限は99です。</small>
<button id="iadd">リストに追加</button>
</div>
</section>

<section class="card hide" data-p="gacha">
<div class="stat" id="gstat">-</div>
<div class="row">
<div><label for="grem">残り回数（0〜255）</label><input type="number" id="grem" min="0" max="255" inputmode="numeric"></div>
<div><label for="gmax">最大回数（0〜255）</label><input type="number" id="gmax" min="0" max="255" inputmode="numeric"></div>
</div>
<small>ゲーム内の表示と「現在」の値が一致しているか確認してから変更してください。</small>
<button id="gadd">リストに追加</button>
</section>
</div>
<p id="msg" role="status"></p>
</main>

<div class="bar hide" id="bar"><div>
<details open><summary>変更リスト（<span id="cnt">0</span>件）</summary><ul id="plist"></ul></details>
<button id="save">まとめて暗号化して保存</button>
</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const msg=(t,c)=>{const m=$("msg");m.textContent=t;m.className=c||""};
const u32=(b,o)=>((b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0);
const p32=(b,o,v)=>{b[o]=v&255;b[o+1]=v>>>8&255;b[o+2]=v>>>16&255;b[o+3]=v>>>24&255};

/* CRC32 */
const CT=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[i]=c>>>0}
const crc32=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CT[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};

/* 先頭256個の奇素数 */
const PR=[];for(let n=3;PR.length<256;n+=2)if(PR.every(p=>p*p>n||n%p))PR.push(n);

/* Xorshift / YWCipher (yw_save.py 準拠) */
class XS{
  constructor(seed){
    this.s=[0x6C078966,0xDD5254A5,0xB9523B81,0x03DF95B3];
    if(seed===0)return;
    let x=seed;
    for(let i=0;i<3;i++){x=(x^(x>>>30))>>>0;x=Math.imul(x,0x6C078965)>>>0;x=(x+i+1)>>>0;this.s[i]=x}
  }
  next(a){
    let x=this.s[0],y=this.s[3];
    this.s[0]=this.s[1];this.s[1]=this.s[2];this.s[2]=this.s[3];
    x=(x^(x<<11))>>>0;x=(x^(x>>>8))>>>0;y=(y^(y>>>19))>>>0;
    this.s[3]=(x^y)>>>0;
    return a?this.s[3]%a:this.s[3];
  }
}
class YW extends XS{
  constructor(seed,n){
    super(seed);
    const t=this.t=Array.from({length:256},(_,i)=>i);
    for(let i=0;i<n;i++){
      const r=this.next(0x10000),r1=r&255,r2=(r>>8)&255;
      if(r1!==r2){const a=t[r1],b=t[r2];[t[a],t[b]]=[t[b],t[a]]}
    }
  }
  xor(d,o){
    let ka=0;
    for(let i=0;i<d.length;i++){
      if(i%256===0)ka=PR[this.t[(i&0xff00)>>8]];
      o[i]=d[i]^this.t[(ka*(i+1))%256];
    }
  }
}

/* 1段目: CRC32 + シード付きXOR */
function ywProc(data,enc){
  const n=data.length,crc=u32(data,n-8),seed=u32(data,n-4);
  if(!enc&&crc32(data.subarray(0,n-8))!==crc)throw new Error("CRC32が一致しません（ファイルが違うか壊れています）");
  const out=new Uint8Array(n);
  new YW(seed,0x1000).xor(data.subarray(0,n-8),out);
  out.set(data.subarray(n-8),n-8);
  if(enc)p32(out,n-8,crc32(out.subarray(0,n-8)));
  return out;
}

/* AES-128 (暗号化のみ) */
const SB=new Uint8Array(256);
(()=>{let p=1,q=1;const r=(v,s)=>((v<<s)|(v>>(8-s)))&255;
  do{p=(p^(p<<1)^(p&128?283:0))&255;q=(q^(q<<1))&255;q=(q^(q<<2))&255;q=(q^(q<<4))&255;if(q&128)q^=9;
    SB[p]=q^r(q,1)^r(q,2)^r(q,3)^r(q,4)^99}while(p!==1);
  SB[0]=99})();
const xt=v=>((v<<1)^(v&128?27:0))&255;
function aesKey(k){
  const w=new Uint8Array(176);w.set(k);let rc=1;
  for(let i=16;i<176;i+=4){
    let t=[w[i-4],w[i-3],w[i-2],w[i-1]];
    if(i%16===0){t=[SB[t[1]]^rc,SB[t[2]],SB[t[3]],SB[t[0]]];rc=xt(rc)}
    for(let j=0;j<4;j++)w[i+j]=w[i-16+j]^t[j];
  }
  return w;
}
function aesEnc(w,inp){
  const s=Uint8Array.from(inp);
  for(let i=0;i<16;i++)s[i]^=w[i];
  for(let r=1;r<=10;r++){
    const u=new Uint8Array(16);
    for(let c=0;c<4;c++)for(let k=0;k<4;k++)u[c*4+k]=SB[s[((c+k)%4)*4+k]];
    if(r<10)for(let c=0;c<4;c++){
      const a0=u[c*4],a1=u[c*4+1],a2=u[c*4+2],a3=u[c*4+3];
      u[c*4]=xt(a0)^xt(a1)^a1^a2^a3;u[c*4+1]=a0^xt(a1)^xt(a2)^a2^a3;
      u[c*4+2]=a0^a1^xt(a2)^xt(a3)^a3;u[c*4+3]=xt(a0)^a0^a1^a2^xt(a3);
    }
    for(let i=0;i<16;i++)s[i]=u[i]^w[r*16+i];
  }
  return s;
}

/* AES-CCM (M=16, nonce 12バイト, タグは暗号文の前) */
function ctrBlk(nonce,i){const b=new Uint8Array(16);b[0]=2;b.set(nonce,1);b[13]=i>>16&255;b[14]=i>>8&255;b[15]=i&255;return b}
function ctrXor(w,nonce,src,dst){
  for(let i=0;i<src.length;i+=16){
    const ks=aesEnc(w,ctrBlk(nonce,i/16+1));
    for(let j=0;j<16&&i+j<src.length;j++)dst[i+j]=src[i+j]^ks[j];
  }
}
function cbcMac(w,nonce,pl){
  const b0=new Uint8Array(16),L=pl.length;
  b0[0]=58;b0.set(nonce,1);b0[13]=L>>16&255;b0[14]=L>>8&255;b0[15]=L&255;
  let x=aesEnc(w,b0);
  for(let i=0;i<L;i+=16){
    const b=new Uint8Array(16);b.set(pl.subarray(i,i+16));
    for(let j=0;j<16;j++)b[j]^=x[j];
    x=aesEnc(w,b);
  }
  return x;
}
function ccmDec(key,f){
  const w=aesKey(key),nonce=f.slice(0,12),c=f.subarray(16);
  const s0=aesEnc(w,ctrBlk(nonce,0)),mac=c.slice(0,16).map((v,i)=>v^s0[i]);
  const pl=new Uint8Array(c.length-16);
  ctrXor(w,nonce,c.subarray(16),pl);
  const m=cbcMac(w,nonce,pl);
  return m.some((v,i)=>v!==mac[i])?null:pl;
}
function ccmEnc(key,nonce,pl){
  const w=aesKey(key),s0=aesEnc(w,ctrBlk(nonce,0)),mac=cbcMac(w,nonce,pl);
  const out=new Uint8Array(32+pl.length);
  out.set(nonce,0);
  for(let i=0;i<16;i++)out[16+i]=mac[i]^s0[i];
  ctrXor(w,nonce,pl,out.subarray(32));
  return out;
}

/* head.yw からAESキーを作る (ywb / ywb_getto) */
function deriveKey(hd,getto){
  const sub=r1=>{let r2=u32(hd,0x10);if(r2)r2--;return u32(hd,r2*0x78+0x39C8+r1*4+0x18)};
  let a=(u32(hd,0x0C)^sub(0x0C))>>>0;
  if(getto&&(sub(0)&0x4000))a=(~a)>>>0;
  const c=new YW(a,sub(0x0A)&0xFF);
  return Uint8Array.from({length:16},()=>c.next(256));
}

/* UI */
let S=null,P=[],H=[];
const hx=o=>"0x"+o.toString(16).toUpperCase().padStart(4,"0");
const rd=(o,l)=>l===1?S.body[o]:u32(S.body,o);

/* 変更リスト: 同じ位置への変更は上書き。保存時にまとめて反映する */
function queue(off,len,val,label){
  P=P.filter(p=>p.off!==off);P.push({off,len,val,label});render();
  msg("リストに追加しました（"+P.length+"件）。続けて他の変更を追加し、最後にまとめて保存できます。","ok");
}
function render(){
  $("bar").classList.toggle("hide",!P.length);$("cnt").textContent=P.length;
  const ul=$("plist");ul.innerHTML="";
  P.forEach(p=>{
    const li=document.createElement("li"),b=document.createElement("button");
    li.append(p.label);b.textContent="✕";b.setAttribute("aria-label","取り消し");
    b.onclick=()=>{P=P.filter(q=>q!==p);render()};li.append(b);ul.append(li);
  });
}
document.querySelectorAll(".tabs button").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===t));
  document.querySelectorAll("[data-p]").forEach(p=>p.classList.toggle("hide",p.dataset.p!==t.dataset.t));
});

/* セクション構造の解析
   セクション = [ID:1B+3B][サイズ:u32][データ][末尾4B]。0xF1,0xF3,0x03,0x08 は子を含む。 */
const CONT=[0xF1,0xF3,0x03,0x08],ITEMSEC={4:"どうぐ・そざい",5:"バトル・そうび"};
function sections(b){
  const map={};
  const walk=(s,e,d)=>{
    for(let o=s;o+8<=e;){
      const id=b[o],sz=u32(b,o+4);
      if(id===0||o+8+sz>e)return false;
      if(CONT.includes(id)){if(d>4||!walk(o+8,o+8+sz,d+1))return false}
      else map[id]=[o+8,o+8+sz];
      o+=8+sz+4;
    }
    return true;
  };
  if(!walk(0,b.length-8,0))return null;
  for(const k in ITEMSEC)if(!map[k]||(map[k][1]-map[k][0])%12)return null;
  return map;
}
const SEC9=[0xBCE4,0xBD88]; // 鬼玉(セクション0x09)のデータ範囲

/* どうぐ表の先頭を探す。
   Bustersの実データでは、どうぐ表は12バイト/個で、
   (0,1),(1,2),(2,3)... の格納番号が並ぶ。
   アイテムIDは4バイト値なので、ID <= 255 という条件は付けない。 */
function findAnchor(b){
  const h=(o,i)=>b[o+i]|b[o+i+1]<<8,end=Math.min(b.length-8,0x12000);
  for(let o=0x400;o+48<=end;o+=4){
    let ok=true;
    for(let k=0;k<4&&ok;k++){
      const e=o+12*k;
      ok=h(e,0)===k&&h(e,2)===k+1&&u32(b,e+4)!==0&&u32(b,e+8)<=255;
    }
    if(ok)return o;
  }
  return -1;
}

function findBusterSection(b,type){
  const length=b.length-8;
  let pos=0;

  // 先頭の F1 コンテナ
  if(pos+8>length)return -1;
  const first=u32(b,pos+4);
  if((first&255)!==0xF1)return -1;
  pos+=8;

  while(pos<length){
    if(pos+8>length)return -1;
    const hdr=u32(b,pos+4),id=hdr&255,sz=hdr>>>8;
    pos+=8;

    if(id===0xF2){
      pos+=sz+4;
      continue;
    }

    if(id!==0xF3){
      pos+=sz+4;
      continue;
    }

    const end=pos+sz;
    while(pos<end){
      if(pos+8>end)return -1;
      const sh=u32(b,pos+4),st=sh&255,ss=sh>>>8;
      if(st===type)return pos;
      pos+=ss+12;
    }
    if(pos!==end)return -1;
  }
  return -1;
}

const gachaOff=()=>{
  const sec1=findBusterSection(S.body,0x01);
  if(sec1>=0 && sec1+0x14B<S.body.length-8)return sec1+0x14A;

  // フォールバック: どうぐ表(0x03)の先頭との既知の相対位置。
  // 今回のBusters構造では 0x6A8 - 0x34E = 0x35A。
  if(S.anc>=0)return S.anc-0x35A;

  return -1;
};
function showGacha(){
  const g=gachaOff();
  if(g<0){$("gstat").textContent="ガシャ回数の位置を特定できませんでした（どうぐ表が見つかりません）。先頭16バイト: "+Array.from(S.body.slice(0,16),v=>v.toString(16).padStart(2,"0")).join(" ");$("gadd").disabled=true;return}
  $("gadd").disabled=false;
  $("gstat").textContent="現在: 残り "+S.body[g]+" 回 / 最大 "+S.body[g+1]+" 回（RAM 0x02DE/0x02DF → ファイル位置 "+hx(g)+"/"+hx(g+1)+"）";
  $("grem").value=S.body[g];$("gmax").value=S.body[g+1];
}

$("load").onclick=async()=>{
  S=null;P=[];render();$("editor").classList.add("hide");
  ["cands","icands"].forEach(i=>$(i).innerHTML="");["newbox","inewbox"].forEach(i=>$(i).classList.add("hide"));
  const hf=$("head").files[0],sf=$("save0").files[0];
  if(!hf||!sf)return msg("head.yw と game*.yw の両方を選んでください。","ng");
  try{
    const hb=new Uint8Array(await hf.arrayBuffer()),fb=new Uint8Array(await sf.arrayBuffer());
    const hd=ywProc(hb,false);
    for(const g of [true,false]){
      const key=deriveKey(hd,g),pl=ccmDec(key,fb);
      if(!pl)continue;
      S={key,nonce:fb.slice(0,12),body:ywProc(pl,false),name:sf.name,getto:g};
      S.secs=sections(S.body);S.anc=findAnchor(S.body);
      S.gsec=findBusterSection(S.body,0x01);
      break;
    }
    if(!S)throw new Error("復号できません。head.yw と game*.yw の組み合わせ（同じスロット・同じ時点のもの）を確認してください。");
    msg("復号に成功しました（"+(S.getto?"月兎組":"赤猫団・白犬隊")+"方式）。","ok");
    showGacha();$("editor").classList.remove("hide");
  }catch(e){msg("エラー: "+e.message,"ng")}
};

/* 鬼玉 */
$("find").onclick=()=>{
  if(!S)return;
  const v=Number($("cur").value);
  if(!Number.isInteger(v)||v<0)return msg("現在の鬼玉の数を整数で入力してください。","ng");
  const scan=(a,b)=>{const r=[];for(let o=a;o+4<=b;o+=4)if(u32(S.body,o)===v)r.push(o);return r};
  let r=scan(SEC9[0],SEC9[1]),wide=false;
  if(!r.length){r=scan(0,S.body.length-8);wide=true}
  const box=$("cands");box.innerHTML="";
  if(!r.length){$("newbox").classList.add("hide");return msg("その値は見つかりませんでした。ゲーム内の数値を確認してください。","ng")}
  r.forEach(o=>{
    const d=document.createElement("label");d.className="cand";
    d.innerHTML='<input type="radio" name="off" value="'+o+'"'+(r.length===1?" checked":"")+'> '+hx(o)+' = '+v;
    box.appendChild(d);
  });
  $("newbox").classList.remove("hide");
  msg(r.length+"件見つかりました。"+(wide?"（鬼玉のセクション外を含む全体検索）":"")+(r.length>1?"\n複数ある場合は、鬼玉を増減させたセーブで再検索して共通の位置を選ぶと確実です。":""),r.length===1&&!wide?"ok":"");
};
$("oadd").onclick=()=>{
  const sel=document.querySelector('input[name=off]:checked'),nv=Number($("nv").value);
  if(!sel)return msg("書き換える位置を選んでください。","ng");
  if(!Number.isInteger(nv)||nv<0||nv>0xFFFFFFFF)return msg("新しい値は 0〜4294967295 の整数にしてください。","ng");
  const o=Number(sel.value);queue(o,4,nv,"鬼玉 "+hx(o)+": "+rd(o,4)+" → "+nv);
};

/* アイテム: 12バイト/個 = 格納番号1(2B) 格納番号2(2B) アイテムID(4B) 所持数(4B)。書き換えるのは所持数のみ */
function parseItemId(){
  const s=$("iid").value.replace(/0x|[\s,]/gi,"");
  if(!/^[0-9a-f]{8}$/i.test(s))return null;
  if($("ord").value==="simple")return parseInt(s,16)>>>0;
  return u32(Uint8Array.from(s.match(/../g),h=>parseInt(h,16)),0);
}
$("ifind").onclick=()=>{
  if(!S)return;
  const id=parseItemId(),box=$("icands");box.innerHTML="";$("inewbox").classList.add("hide");H=[];
  if(id===null)return msg("アイテムIDは8桁の16進数で入力してください。","ng");
  if(S.anc>=0){
    // 表先頭から 12バイト刻み。どうぐ・そざい(+見出し分12バイト)・バトル・そうびまで連続して走査
    const end=Math.min(S.anc+0x1770+12+0x11D0,S.body.length-8);
    for(let o=S.anc,i=0;o+12<=end;o+=12,i++)
      if(u32(S.body,o+4)===id&&u32(S.body,o+8)<=255)H.push({c:o+8,name:"枠 #"+(i+1)});
  }else if(S.secs){
    for(const k in ITEMSEC){
      const [a,b]=S.secs[k];
      for(let o=a,i=0;o+12<=b;o+=12,i++)if(u32(S.body,o+4)===id)H.push({c:o+8,name:ITEMSEC[k]+" #"+(i+1)});
    }
  }else{
    for(let o=4;o+8<=S.body.length-8;o+=4){
      const c=u32(S.body,o+4);
      if(u32(S.body,o)===id&&c>=1&&c<=99)H.push({c:o+4,name:"位置不明"});
    }
  }
  if(!H.length)return msg("そのIDのアイテムは、どうぐ・そざい／バトル・そうび内に見つかりませんでした。\n未所持のアイテム、または個数を持たない「だいじなもの」等の可能性があります（未所持アイテムの追加には対応していません）。","ng");
  H.forEach((h,i)=>{
    const d=document.createElement("label");d.className="cand";
    d.innerHTML='<input type="radio" name="ioff" value="'+i+'"'+(H.length===1?" checked":"")+'> '+h.name+' / '+hx(h.c)+' / 現在 ×'+rd(h.c,4);
    box.appendChild(d);
  });
  $("inewbox").classList.remove("hide");
  msg(H.length+"件見つかりました。"+((S.anc>=0||S.secs)?"":"\n※どうぐ表を特定できなかったため全体検索の結果です。内容をよく確認してください。"),(S.anc>=0||S.secs)&&H.length===1?"ok":"");
};
$("iadd").onclick=()=>{
  const sel=document.querySelector('input[name=ioff]:checked'),nv=Number($("inv").value);
  if(!sel)return msg("書き換えるアイテムを選んでください。","ng");
  if(!Number.isInteger(nv)||nv<1||nv>99)return msg("所持数は 1〜99 の整数にしてください。","ng");
  const h=H[Number(sel.value)];queue(h.c,4,nv,h.name+" "+hx(h.c)+": ×"+rd(h.c,4)+" → ×"+nv);
};

/* ガシャ回数 */
$("gadd").onclick=()=>{
  const g=gachaOff(),r=Number($("grem").value),m=Number($("gmax").value);
  if(g<0)return;
  if(![r,m].every(v=>Number.isInteger(v)&&v>=0&&v<=255))return msg("回数は 0〜255 の整数にしてください。","ng");
  if(r>m)return msg("残り回数は最大回数以下にしてください。","ng");
  queue(g,1,r,"ガシャ残り "+hx(g)+": "+S.body[g]+" → "+r);
  queue(g+1,1,m,"ガシャ最大 "+hx(g+1)+": "+S.body[g+1]+" → "+m);
};

/* まとめて保存: 変更を全部反映 → 暗号化 → 復号して再検証 → ダウンロード */
$("save").onclick=()=>{
  if(!S||!P.length)return;
  const bak=S.body.slice();
  try{
    P.forEach(p=>p.len===1?(S.body[p.off]=p.val):p32(S.body,p.off,p.val));
    const out=ccmEnc(S.key,S.nonce,ywProc(S.body,true));
    // CRC32は再暗号化時に新しく計算されるため、本文とseedだけを比較する。
    const back=ywProc(ccmDec(S.key,out)||(()=>{throw new Error("再検証に失敗しました")})(),false);
    const bl=S.body.length-8;
    const same=back.length===S.body.length&&back.every((v,i)=>i>=bl||v===S.body[i])&&[4,5,6,7].every(k=>back[bl+k]===S.body[bl+k]);
    if(!same)throw new Error("再検証で本文またはseedが不一致。保存を中止しました。");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([out],{type:"application/octet-stream"}));
    a.download=S.name;document.body.appendChild(a);a.click();a.remove();
    const n=P.length;P=[];render();
    ["cands","icands"].forEach(i=>$(i).innerHTML="");["newbox","inewbox"].forEach(i=>$(i).classList.add("hide"));showGacha();
    msg(n+"件の変更を反映して保存しました（"+S.name+"）。元のファイルと同じ方法で書き戻してください。head.yw は書き戻し不要です。","ok");
  }catch(e){S.body=bak;msg("エラー: "+e.message,"ng")}
};
